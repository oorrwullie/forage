routes:
  - name: local-qwen
    provider: ollama
    model: qwen3-coder:30b
    endpoint: http://127.0.0.1:11434/api/chat
    cost: free
    data_policy: local
    capabilities:
      chat: true
      json_schema: false
      usage: true
      reasoning_usage: false
      context_tokens: 262144

